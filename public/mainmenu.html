<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Главное меню - Общежитие №6</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body>
        <header class="topbar">
            <div class="topbar-box">
                <h1>Главное меню</h1>
                <div class="actions">
                    <button id="logoutBtn" class="btn">Выйти</button>
                </div>
            </div>
        </header>

        <main class="mainmenu-content">
            <nav class="tabs">
                <button class="tabBtn active" data-tab="announcements">Объявления</button>
                <button class="tabBtn" data-tab="laundry">Стирка</button>
                <button class="tabBtn" data-tab="shifts">Ремонт</button>
                <button class="tabBtn" data-tab="admin-overview" style="display: none">Администрирование</button>
                <button class="tabBtn" data-tab="sales">Продажи</button>
                <button class="tabBtn" data-tab="events">Мероприятия</button>
            </nav>
            <section id="announcements" class="tab active">
                <div class="header">
                    <h3>Объявления</h3>
                    <button id="toggleAddAnnouncement" class="toggle-form-btn" style="display: none">
                        + Создать объявление
                    </button>
                </div>
                <div id="announcementsModal" class="modal-overlay hidden">
                    <div class="modal-content">
                        <div class="form-header">
                            <h4>Новое объявление</h4>
                            <span class="close-modal-announcements">&times;</span>
                        </div>
                        <form id="noticeCreateForm" class="simple-form">
                            <label>Заголовок:<input name="title" required /></label>
                            <label>Текст:<textarea name="body" required></textarea></label>
                            <button type="button" class="btn" id="create-announcement-btn">
                                Опубликовать объявление
                            </button>
                            <button type="button" class="btn" id="update-announcement-btn" style="display: none">
                                Сохранить изменения
                            </button>
                            <input type="hidden" name="announcement_id" value="" />
                        </form>
                    </div>
                </div>
                <div class="announcements-wrapper"></div>
            </section>

            <section id="laundry" class="tab hidden">
                <div class="filter">
                    <label for="laundry-select">🧺 Стиральная машинка:</label>
                    <select id="laundry-select" class="form-select"></select>
                </div>
                <div id="calendar-content-laundry"></div>
            </section>
            <section id="shifts" class="tab hidden">
                <div id="calendar-content-repair"></div>
            </section>
            <section id="sales" class="tab hidden">
                <div class="sales-container">
                    <div class="header">
                        <h3>Продажи</h3>
                        <button id="toggleAddProduct" class="toggle-form-btn">+ Добавить товар</button>
                    </div>
                    <div id="productModal" class="modal-overlay hidden">
                        <div class="modal-content">
                            <form id="product-form" class="product-form" enctype="multipart/form-data">
                                <div class="form-header">
                                    <h4>Новый товар</h4>
                                    <span class="close-modal">&times;</span>
                                </div>

                                <label class="form-label">
                                    <span>Название *</span>
                                    <input
                                        type="text"
                                        name="title"
                                        id="productName"
                                        required
                                        placeholder="Например: Джинсы"
                                    />
                                </label>

                                <label class="form-label">
                                    <span>Фото</span>
                                    <input type="file" name="image" accept="image/*" />
                                </label>

                                <label class="form-label">
                                    <span>Описание</span>
                                    <textarea name="description" rows="3" placeholder="Состояние, размер..."></textarea>
                                </label>

                                <label class="form-label">
                                    <span>Цена (₽) *</span>
                                    <input type="number" name="price" min="0" max="100000" step="0.01" required />
                                </label>

                                <label class="form-label">
                                    <span>Количество *</span>
                                    <input
                                        type="number"
                                        name="stock"
                                        min="1"
                                        max="1000000"
                                        step="1"
                                        value="1"
                                        required
                                    />
                                </label>

                                <label class="form-label">
                                    <span>Номер телефона</span>
                                    <input
                                        type="tel"
                                        id="seller_contact"
                                        name="seller_contact"
                                        placeholder="+7 (999) 000-00-00"
                                    />
                                </label>

                                <label class="form-label">
                                    <span>Ник в Телеграме</span>
                                    <input
                                        type="text"
                                        id="seller_contact_telegram"
                                        name="seller_contact_telegram"
                                        placeholder="@your_tg_name"
                                        maxlength="18"
                                    />
                                </label>

                                <button type="submit" class="form-btn" id="btn-create-product">Опубликовать</button>
                                <button type="submit" id="btn-update-product" class="form-btn" style="display: none">
                                    Сохранить изменения
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
            <section id="admin-overview" class="tab hidden"></section>
            <section id="events" class="tab hidden"></section>
            <div id="eventModal" class="modal-overlay hidden">
                <div class="modal-content">
                    <form id="event-form" class="product-form">
                        <div class="form-header">
                            <h4>Новое мероприятие</h4>
                            <span class="close-modal">&times;</span>
                        </div>

                        <label class="form-label">
                            <span>Название *</span>
                            <input
                                type="text"
                                name="title"
                                id="evt-title"
                                required
                                placeholder="Например: Вечер настольных игр"
                            />
                        </label>

                        <label class="form-label">
                            <span>Фото</span>
                            <input type="file" name="image" accept="image/*" />
                        </label>

                        <label class="form-label">
                            <span>Описание</span>
                            <textarea name="description" rows="3" placeholder="Подробности мероприятия..."></textarea>
                        </label>

                        <label class="form-label">
                            <span>Дата и время *</span>
                            <input
                                type="datetime-local"
                                name="event_date"
                                id="evt-date"
                                min="2026-01-01T00:00"
                                max="9999-12-31T23:59"
                                required
                            />
                        </label>

                        <label class="form-label">
                            <span>Место проведения</span>
                            <input
                                type="text"
                                name="location"
                                id="evt-loc"
                                placeholder="Например: Актовый зал, 3 этаж"
                            />
                        </label>

                        <label class="form-label">
                            <span>Номер телефона</span>
                            <input
                                type="tel"
                                id="organizer_contact"
                                name="organizer_contact"
                                placeholder="+7 (999) 000-00-00"
                                pattern="(\+7|8)\s\(\d{3}\)\s\d{3}-\d{2}-\d{2}"
                            />
                        </label>

                        <button type="button" class="form-btn" id="event-create-btn">Создать мероприятие</button>
                        <button type="button" class="form-btn" id="event-update-btn" style="display: none">
                            Сохранить изменения
                        </button>
                        <input type="hidden" name="event_id" value="" />
                    </form>
                </div>
            </div>
        </main>

        <script type="module" src="js/mainmenu.js"></script>
    </body>
</html>
