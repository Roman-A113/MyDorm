<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Вход / Регистрация - Общежитие №6</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>

    <body class="auth-page">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <form id="registerForm">
                <label>ФИО<input type="text" name="name" required /></label>
                <label>Почта<input type="email" name="email" required /></label>
                <label>Пароль<input type="password" name="password" required minlength="6" /></label>
                <button type="submit">Зарегистрироваться</button>
            </form>
            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="login.html">Войти</a></p>
            </div>
        </div>
    </body>
    <script type="module" src="js/registration.js"></script>
</html>
